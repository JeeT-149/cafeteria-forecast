version: '3.8'

services:
  db:
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: cafe
    command: --sql-mode="NO_ENGINE_SUBSTITUTION" --innodb-buffer-pool-size=2G --innodb-flush-log-at-trx-commit=2 --max_allowed_packet=1G --skip-log-bin
    ports:
      - "3306:3306"
    volumes:
      - ./data/interim/tables:/tables
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppass"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
